[package]
name = "fetlife-action-text"
version = "0.1.1"
edition = "2024"
description = "Lexxy / Action Text HTML: plain text, clipped previews and content analysis"
license = "MIT"
repository = "https://github.com/fetlife/action-text"
publish = false

[dependencies]
dom_query = { version = "0.29.0", default-features = false, features = ["atomic"] }
html5ever = "0.40.1"
serde = { version = "1.0.229", features = ["derive"] }
